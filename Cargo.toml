[package]
name = "_rheaps"
version = "0.16.0"
edition = "2024"
rust-version = "1.88"
publish = false

[lib]
name = "_rheaps"
crate-type = ["cdylib"]

[dependencies]
pyo3 = { version = "0.29", features = ["extension-module", "num-bigint", "multiple-pymethods"] }
num-bigint = "0.4"
rheaps = "0.16.0"

[profile.release]
lto = true
